name: Generate Contribution Snake Animation

on:
  schedule:
    # Tự động chạy mỗi 12 tiếng một lần để cập nhật commit mới nhất
    - cron: "0 */12 * * *"
  # Cho phép bấm nút "Run workflow" thủ công trên tab Actions
  workflow_dispatch:
  # Tự động chạy khi có commit mới đẩy lên nhánh main
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38bdf8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Deploy Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
