name: Generate Profile Visuals & 3D Contribution

on:
  schedule:
    # Tự động chạy mỗi 12 tiếng một lần để cập nhật commit mới nhất
    - cron: "0 */12 * * *"
  # Cho phép bấm nút "Run workflow" thủ công trên tab Actions
  workflow_dispatch:
  # Tự động chạy khi có commit mới đẩy lên nhánh main
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4

      # 1. Sinh hiệu ứng Game Con Rắn (Snake)
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38bdf8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Sinh hiệu ứng Thành phố 3D Isometric (3D Contribution Graph)
      - name: Generate 3D Contribution City Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Organize Visual Assets
        run: |
          mkdir -p dist/profile-3d-contrib
          cp -r profile-3d-contrib/* dist/profile-3d-contrib/ || true

      # 3. Đẩy toàn bộ ảnh động vào nhánh output
      - name: Deploy Visuals to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
